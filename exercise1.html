<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Exercise 1- Canvas</title>
    </head>
    <body>
         <!--Create a 500 × 500 Canvas.-->
        <canvas id="myCanvas" width="500" height="500">
            Your browser does not support Canvas.
        </canvas>

        <script>
            window.canvas=document.getElementById("myCanvas");
            window.ctx=canvas.getContext("2d");
            //Green background
            ctx.fillStyle="lightgreen";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            //Yellow round face
            ctx.beginPath();
            ctx.arc(250,250,200,0,Math.PI*2);
            ctx.fillStyle="yellow";
            ctx.fill();
            ctx.strokeStyle="olive";
            ctx.lineWidth=2;
            ctx.stroke();
            //Left eye
            ctx.beginPath();
            ctx.arc(170,200,15,0,Math.PI*2);
            ctx.fillStyle="black";
            ctx.fill();
            //Right eye
            ctx.beginPath();
            ctx.arc(330,200,15,0,Math.PI*2);
            ctx.fillStyle="black";
            ctx.fill();
            //nose
            ctx.beginPath();
            ctx.moveTo(250,250);
            ctx.lineTo(250,300);
            ctx.stroke();
            //Smiling mouth
            ctx.beginPath();
            ctx.arc(250,310,75,Math.PI*0.1,Math.PI*0.9);
            ctx.stroke();
            //Bottom text
            ctx.font="bold 28px Arial";
            ctx.fillStyle="darkgreen";
            ctx.textAlign="center";
            ctx.fillText("The Canvas brought me to life!",250,490);
        </script>
    </body>
</html>
